name: Add mobile maps

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-mobile-map.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch mobile app
        run: python .github/scripts/add_mobile_map.py
      - name: Commit map support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/App.js
          git rm .github/workflows/add-mobile-map.yml .github/scripts/add_mobile_map.py
          git commit -m "Add map location picker to all mobile listing categories"
          git push origin main
