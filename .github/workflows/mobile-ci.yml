name: Mobile CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create PNG launcher icon
        run: |
          python3 -m pip install --quiet cairosvg
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='assets/kaikki-icon.svg', write_to='assets/kaikki-icon.png', output_width=1024, output_height=1024)
          PY
      - name: Expo Doctor
        continue-on-error: true
        run: npx expo-doctor
      - name: Export iOS bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
        run: npx expo export --platform ios --output-dir dist-ios

  build-android-apk:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create PNG launcher icon
        run: |
          python3 -m pip install --quiet cairosvg
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='assets/kaikki-icon.svg', write_to='assets/kaikki-icon.png', output_width=1024, output_height=1024)
          PY
      - name: Force final Android home and navigation layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('App.js')
          s=p.read_text()

          start=s.find("{tab==='home'&&<ScrollView")
          end=s.find("{tab==='favorites'&&", start)
          if start < 0 or end < 0:
              raise SystemExit('Home view markers not found')

          new_home="""{tab==='home'&&<ScrollView contentContainerStyle={s.homePage} showsVerticalScrollIndicator={false}><View style={s.homeSearch}><TextInput value={query} onChangeText={setQuery} placeholder=\"Haku\" placeholderTextColor=\"#94a3b8\" style={s.homeSearchInput}/><Text style={s.homeSearchIcon}>⌕</Text></View><View style={s.categoryTitleWrap}><Text style={s.categoryTitle}>Kategoriat</Text></View><View style={s.quickPanel}>{[['Autot','🚗','Autot','#edf4ff'],['Asunnot','🏠','Asunnot','#fff2e8'],['Elektroniikka','📱','Elektroniikka','#f4edff'],['Koti & Sisustus','🛋️','Koti','#edf9ec'],['Vapaa-aika','🚲','Palvelut','#eaf9f7'],['Lapset ja vanhemmat','👶','Kaikki','#fff8df'],['Eläintarvikkeet','🐾','Kaikki','#f7f0e9'],['Piha ja remontointi','🌿','Kaikki','#eaf8ef'],['Antiikki ja taide','🖼️','Kaikki','#f4edff'],['Ja paljon muuta','🏷️','Kaikki','#f1f5f9']].map(([label,icon,value,bg])=><Pressable key={label} onPress={()=>setCategory(value)} style={s.quickItem}><View style={[s.quickIconWrap,{backgroundColor:bg},category===value&&s.quickIconWrapActive]}><Text style={s.quickIcon}>{icon}</Text></View><Text style={[s.quickLabel,category===value&&s.quickLabelActive]} numberOfLines={2}>{label}</Text></Pressable>)}</View><View style={s.homeSectionHead}><View><Text style={s.homeSectionTitle}>Uusimmat</Text><Text style={s.homeSectionMeta}>{filtered.length} ilmoitusta</Text></View></View>{filtered.length?<View style={s.marketList}>{filtered.slice(0,4).map(item=><View key={String(item.id)} style={s.marketGridItem}>{marketCard(item)}</View>)}</View>:<View style={s.emptyState}><Text style={s.emptyEmoji}>🔎</Text><Text style={s.emptyTitle}>Ei ilmoituksia</Text><Text style={s.emptyText}>Kokeile toista hakua tai kategoriaa.</Text></View>}</ScrollView>}\n """
          s=s[:start]+new_home+s[end:]

          bottom_start=s.find('<View style={s.bottom}>')
          bottom_end=s.find('</View></SafeAreaView>', bottom_start)
          if bottom_start < 0 or bottom_end < 0:
              raise SystemExit('Bottom navigation markers not found')
          new_bottom="""<View style={s.bottom}><Pressable onPress={()=>setTab('home')} style={s.bottomItem}><Text style={tab==='home'?s.bottomIconActive:s.bottomIcon}>⌂</Text><Text style={tab==='home'?s.bottomLabelActive:s.bottomLabel}>Etusivu</Text></Pressable><Pressable onPress={()=>setTab('notifications')} style={s.bottomItem}><Text style={tab==='notifications'?s.bottomIconActive:s.bottomIcon}>♢</Text><Text style={tab==='notifications'?s.bottomLabelActive:s.bottomLabel}>Notifikaatiot</Text></Pressable><Pressable onPress={()=>setTab('sell')} style={s.bottomItem}><View style={s.sellTab}><Text style={s.sellTabText}>＋</Text></View><Text style={tab==='sell'?s.bottomLabelActive:s.bottomLabel}>Uusi ilmoitus</Text></Pressable><Pressable onPress={()=>setTab('messages')} style={s.bottomItem}><Text style={tab==='messages'?s.bottomIconActive:s.bottomIcon}>✉</Text><Text style={tab==='messages'?s.bottomLabelActive:s.bottomLabel}>Viestit</Text></Pressable><Pressable onPress={()=>setTab('profile')} style={s.bottomItem}><Text style={['profile','myListings','favorites'].includes(tab)?s.bottomIconActive:s.bottomIcon}>♙</Text><Text style={['profile','myListings','favorites'].includes(tab)?s.bottomLabelActive:s.bottomLabel}>Oma</Text></Pressable></View>"""
          s=s[:bottom_start]+new_bottom+s[bottom_end+len('</View>'):]

          replacements={
            r"quickPanel:\{.*?\},quickItem:":"quickPanel:{marginTop:4,marginHorizontal:8,backgroundColor:'#fff',borderRadius:18,paddingVertical:8,paddingHorizontal:2,flexDirection:'row',flexWrap:'wrap',justifyContent:'flex-start',alignItems:'flex-start',elevation:2},quickItem:",
            r"quickItem:\{[^}]*\}":"quickItem:{width:'20%',minWidth:'20%',maxWidth:'20%',flexBasis:'20%',flexGrow:0,flexShrink:0,minHeight:82,alignItems:'center',justifyContent:'flex-start',gap:4,paddingVertical:5,paddingHorizontal:1}",
            r"quickIconWrap:\{[^}]*\}":"quickIconWrap:{width:42,height:42,borderRadius:14,alignItems:'center',justifyContent:'center'}",
            r"quickIcon:\{[^}]*\}":"quickIcon:{fontSize:22}",
            r"quickLabel:\{[^}]*\}":"quickLabel:{fontSize:9.2,color:'#53657c',fontWeight:'700',textAlign:'center',lineHeight:11.5}",
            r"marketList:\{[^}]*\}":"marketList:{paddingHorizontal:10,paddingBottom:110,gap:10,flexDirection:'row',flexWrap:'wrap',justifyContent:'space-between'}"
          }
          for pat,rep in replacements.items():
              s=re.sub(pat,rep,s,count=1)

          if 'marketGridItem:' not in s:
              s=s.replace("marketList:{", "marketGridItem:{width:'48.5%'},marketList:{", 1)
          if 'categoryTitleWrap:' not in s:
              s=s.replace("popularHead:{", "categoryTitleWrap:{paddingHorizontal:14,paddingTop:10,paddingBottom:2},categoryTitle:{fontSize:20,fontWeight:'900',color:'#0f172a'},popularHead:{")
          if 'homeSearch:' not in s:
              s=s.replace("categoryTitleWrap:{", "homeSearch:{marginHorizontal:10,marginTop:8,marginBottom:6,height:46,borderRadius:14,borderWidth:1,borderColor:'#e2e8f0',backgroundColor:'#fff',flexDirection:'row',alignItems:'center',paddingHorizontal:12},homeSearchInput:{flex:1,fontSize:15,color:'#0f172a'},homeSearchIcon:{fontSize:23,color:'#64748b'},categoryTitleWrap:{",1)

          p.write_text(s)
          PY
      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean
      - name: Build release APK with bundled JavaScript
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kaikki-fi-Android-Release-APK
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
