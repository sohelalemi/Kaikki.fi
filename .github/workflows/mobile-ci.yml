name: Mobile CI

permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create PNG launcher icon
        run: |
          python3 -m pip install --quiet cairosvg
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='assets/kaikki-icon.svg', write_to='assets/kaikki-icon.png', output_width=1024, output_height=1024)
          PY
      - name: Expo Doctor
        continue-on-error: true
        run: npx expo-doctor
      - name: Export iOS bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
        run: npx expo export --platform ios --output-dir dist-ios

  build-android-apk:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create PNG launcher icon
        run: |
          python3 -m pip install --quiet cairosvg
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='assets/kaikki-icon.svg', write_to='assets/kaikki-icon.png', output_width=1024, output_height=1024)
          PY
      - name: Apply Android mobile layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('App.js')
          s=p.read_text()

          start=s.find("{tab==='home'&&<ScrollView")
          end=s.find("{tab==='favorites'&&", start)
          if start < 0 or end < 0:
              raise SystemExit('Home view markers not found')

          new_home="""{tab==='home'&&<ScrollView contentContainerStyle={s.homePage} showsVerticalScrollIndicator={false}><View style={s.categoryTitleWrap}><Text style={s.categoryTitle}>Kategoriat</Text></View><View style={s.quickPanel}>{[['Autot','🚗','Autot'],['Asunnot','🏠','Asunnot'],['Elektroniikka','📱','Elektroniikka'],['Koti & Sisustus','🛋️','Koti'],['Vapaa-aika','🚲','Palvelut'],['Lapset ja vanhemmat','👶','Kaikki'],['Eläintarvikkeet','🐾','Kaikki'],['Piha ja remontointi','🌿','Kaikki'],['Antiikki ja taide','🖼️','Kaikki'],['Ja paljon muuta','🏷️','Kaikki']].map(([label,icon,value])=><Pressable key={label} onPress={()=>setCategory(value)} style={s.quickItem}><View style={[s.quickIconWrap,category===value&&s.quickIconWrapActive]}><Text style={s.quickIcon}>{icon}</Text></View><Text style={[s.quickLabel,category===value&&s.quickLabelActive]} numberOfLines={2}>{label}</Text></Pressable>)}</View><View style={s.homeSectionHead}><View><Text style={s.homeSectionTitle}>Uusimmat ilmoitukset</Text><Text style={s.homeSectionMeta}>{filtered.length} ilmoitusta</Text></View></View>{filtered.length?<View style={s.marketList}>{filtered.map(item=><View key={String(item.id)}>{marketCard(item)}</View>)}</View>:<View style={s.emptyState}><Text style={s.emptyEmoji}>🔎</Text><Text style={s.emptyTitle}>Ei ilmoituksia</Text><Text style={s.emptyText}>Kokeile toista hakua tai kategoriaa.</Text></View>}</ScrollView>}\n """
          s=s[:start]+new_home+s[end:]

          # Compact category grid: exactly five items per row, two rows.
          s=s.replace("quickPanel:{marginTop:8,marginHorizontal:14,backgroundColor:'#fff',borderRadius:24,paddingVertical:12,paddingHorizontal:8,flexDirection:'row',flexWrap:'wrap',justifyContent:'space-between'", "quickPanel:{marginTop:4,marginHorizontal:10,backgroundColor:'#fff',borderRadius:18,paddingVertical:8,paddingHorizontal:4,flexDirection:'row',flexWrap:'wrap',justifyContent:'flex-start'")
          s=s.replace("quickItem:{width:'50%',minHeight:84,alignItems:'center',justifyContent:'center',gap:6,paddingVertical:8}", "quickItem:{width:'20%',minHeight:72,alignItems:'center',justifyContent:'center',gap:4,paddingVertical:5,paddingHorizontal:2}")
          s=s.replace("quickIconWrap:{width:46,height:46,borderRadius:23", "quickIconWrap:{width:38,height:38,borderRadius:19")
          s=s.replace("quickIcon:{fontSize:24}", "quickIcon:{fontSize:20}")
          s=s.replace("quickLabel:{fontSize:10.5,color:'#53657c',fontWeight:'700',textAlign:'center',lineHeight:13}", "quickLabel:{fontSize:9.5,color:'#53657c',fontWeight:'700',textAlign:'center',lineHeight:11.5}")
          s=s.replace("popularHead:{", "categoryTitleWrap:{paddingHorizontal:14,paddingTop:10,paddingBottom:2},categoryTitle:{fontSize:20,fontWeight:'900',color:'#0f172a'},popularHead:{")

          old_nav="<View style={s.bottom}><Pressable onPress={()=>setTab('home')} style={s.bottomItem}><Text style={tab==='home'?s.bottomIconActive:s.bottomIcon}>⌂</Text><Text style={tab==='home'?s.bottomLabelActive:s.bottomLabel}>Etusivu</Text></Pressable><Pressable onPress={()=>{loadNotifications();setTab('notifications')}} style={s.bottomItem}><Text style={tab==='notifications'?s.bottomIconActive:s.bottomIcon}>♢</Text><Text style={tab==='notifications'?s.bottomLabelActive:s.bottomLabel}>Ilmoitukset</Text></Pressable><Pressable onPress={()=>setTab('sell')} style={s.bottomItem}><Text style={s.bottomPlus}>＋</Text><Text style={tab==='sell'?s.bottomLabelActive:s.bottomLabel}>Uusi ilmoitus</Text></Pressable><Pressable onPress={()=>{loadMessages();setTab('messages')}} style={s.bottomItem}><Text style={tab==='messages'?s.bottomIconActive:s.bottomIcon}>◉</Text><Text style={s.bottomLabel}>Viestit</Text></Pressable><Pressable onPress={()=>setTab('profile')} style={s.bottomItem}><Text style={['profile','myListings'].includes(tab)?s.bottomIconActive:s.bottomIcon}>♙</Text><Text style={['profile','myListings'].includes(tab)?s.bottomLabelActive:s.bottomLabel}>Oma Kaikki</Text></Pressable></View>"
          new_nav="<View style={s.bottom}><Pressable onPress={()=>setTab('home')} style={s.bottomItem}><Text style={tab==='home'?s.bottomIconActive:s.bottomIcon}>⌂</Text><Text style={tab==='home'?s.bottomLabelActive:s.bottomLabel}>Etusivu</Text></Pressable><Pressable onPress={()=>{setCategory('Kaikki');setTab('home')}} style={s.bottomItem}><Text style={s.bottomIcon}>⌕</Text><Text style={s.bottomLabel}>Haku</Text></Pressable><Pressable onPress={()=>setTab('sell')} style={s.bottomItem}><View style={s.sellTab}><Text style={s.sellTabText}>＋</Text></View><Text style={tab==='sell'?s.bottomLabelActive:s.bottomLabel}>Lisää</Text></Pressable><Pressable onPress={()=>setTab('favorites')} style={s.bottomItem}><Text style={tab==='favorites'?s.bottomIconActive:s.bottomIcon}>♡</Text><Text style={tab==='favorites'?s.bottomLabelActive:s.bottomLabel}>Suosikit</Text></Pressable><Pressable onPress={()=>setTab('profile')} style={s.bottomItem}><Text style={['profile','myListings'].includes(tab)?s.bottomIconActive:s.bottomIcon}>♙</Text><Text style={['profile','myListings'].includes(tab)?s.bottomLabelActive:s.bottomLabel}>Oma</Text></Pressable></View>"
          if old_nav in s:
              s=s.replace(old_nav,new_nav)

          # Keep the confirmed bottom navigation position unchanged.
          s=s.replace("bottom:{position:'absolute',left:0,right:0,bottom:-48,height:82", "bottom:{position:'absolute',left:0,right:0,bottom:-28,height:82")
          s=s.replace("bottom:{position:'absolute',left:0,right:0,bottom:0,height:78", "bottom:{position:'absolute',left:0,right:0,bottom:-28,height:82")
          s=s.replace("bottom:{position:'absolute',left:0,right:0,bottom:0,height:82", "bottom:{position:'absolute',left:0,right:0,bottom:-28,height:82")

          s=s.replace("compose:{position:'absolute',left:0,right:0,bottom:36", "compose:{position:'absolute',left:0,right:0,bottom:56")
          s=s.replace("compose:{position:'absolute',left:0,right:0,bottom:84", "compose:{position:'absolute',left:0,right:0,bottom:56")
          s=s.replace("compose:{position:'absolute',left:0,right:0,bottom:74", "compose:{position:'absolute',left:0,right:0,bottom:56")

          for old,new in [
              ("homePage:{paddingBottom:170", "homePage:{paddingBottom:100"),
              ("homePage:{paddingBottom:118", "homePage:{paddingBottom:100"),
              ("homePage:{paddingBottom:90", "homePage:{paddingBottom:100"),
              ("homePage:{paddingBottom:105", "homePage:{paddingBottom:100"),
              ("list:{padding:14,gap:14,paddingBottom:165", "list:{padding:14,gap:14,paddingBottom:105"),
              ("list:{padding:14,gap:14,paddingBottom:118", "list:{padding:14,gap:14,paddingBottom:105"),
              ("list:{padding:14,gap:14,paddingBottom:95", "list:{padding:14,gap:14,paddingBottom:105"),
              ("list:{padding:14,gap:14,paddingBottom:100", "list:{padding:14,gap:14,paddingBottom:105"),
              ("form:{padding:20,gap:14,paddingBottom:175", "form:{padding:20,gap:14,paddingBottom:110"),
              ("form:{padding:20,gap:14,paddingBottom:125", "form:{padding:20,gap:14,paddingBottom:110"),
              ("form:{padding:20,gap:14,paddingBottom:100", "form:{padding:20,gap:14,paddingBottom:110"),
              ("detail:{padding:20,gap:14,paddingBottom:175", "detail:{padding:20,gap:14,paddingBottom:110"),
              ("detail:{padding:20,gap:14,paddingBottom:125", "detail:{padding:20,gap:14,paddingBottom:110"),
              ("detail:{padding:20,gap:14,paddingBottom:100", "detail:{padding:20,gap:14,paddingBottom:110"),
              ("marketList:{paddingHorizontal:14,paddingBottom:175", "marketList:{paddingHorizontal:14,paddingBottom:110"),
              ("marketList:{paddingHorizontal:14,paddingBottom:125", "marketList:{paddingHorizontal:14,paddingBottom:110"),
              ("marketList:{paddingHorizontal:14,paddingBottom:100", "marketList:{paddingHorizontal:14,paddingBottom:110"),
              ("profilePage:{paddingHorizontal:16,paddingTop:6,paddingBottom:175", "profilePage:{paddingHorizontal:16,paddingTop:6,paddingBottom:110"),
              ("profilePage:{paddingHorizontal:16,paddingTop:6,paddingBottom:125", "profilePage:{paddingHorizontal:16,paddingTop:6,paddingBottom:110"),
              ("profilePage:{paddingHorizontal:16,paddingTop:6,paddingBottom:100", "profilePage:{paddingHorizontal:16,paddingTop:6,paddingBottom:110")]:
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Persist Android layout source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.js
          if ! git diff --cached --quiet; then
            git commit -m "Use compact two-row Android categories [skip ci]"
            git push origin HEAD:main
          fi
      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean
      - name: Build release APK with bundled JavaScript
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kaikki-fi-Android-Release-APK
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
