name: Mobile CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create PNG launcher icon
        run: |
          python3 -m pip install --quiet cairosvg
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='assets/kaikki-icon.svg', write_to='assets/kaikki-icon.png', output_width=1024, output_height=1024)
          PY
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Export iOS bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
        run: npx expo export --platform ios --output-dir dist-ios

  build-android-apk:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create PNG launcher icon
        run: |
          python3 -m pip install --quiet cairosvg
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='assets/kaikki-icon.svg', write_to='assets/kaikki-icon.png', output_width=1024, output_height=1024)
          PY
      - name: Apply Android UI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('App.js')
          s=p.read_text()
          s=s.replace("hero:{backgroundColor:'#e8f3ff',paddingHorizontal:20,paddingTop:18,paddingBottom:34,minHeight:245}","hero:{backgroundColor:'#e8f3ff',paddingHorizontal:20,paddingTop:12,paddingBottom:24,minHeight:205}")
          s=s.replace("heroText:{fontSize:15,color:'#405878',fontWeight:'700',marginTop:20,maxWidth:230,lineHeight:21}","heroText:{fontSize:15,color:'#405878',fontWeight:'700',marginTop:12,maxWidth:230,lineHeight:21}")
          s=s.replace("heroSearch:{height:58,borderRadius:19,backgroundColor:'#fff',flexDirection:'row',alignItems:'center',paddingLeft:14,marginTop:22", "heroSearch:{height:54,borderRadius:19,backgroundColor:'#fff',flexDirection:'row',alignItems:'center',paddingLeft:14,marginTop:14")
          # Android three-button navigation can overlay an absolute bottom bar on newer devices.
          # Lift Kaikki's tab bar above the system navigation area so labels and icons remain visible.
          s=s.replace("bottom:{position:'absolute',left:0,right:0,bottom:0,height:78", "bottom:{position:'absolute',left:0,right:0,bottom:48,height:78")
          s=s.replace("compose:{position:'absolute',left:0,right:0,bottom:74", "compose:{position:'absolute',left:0,right:0,bottom:122")
          s=s.replace("homePage:{paddingBottom:105", "homePage:{paddingBottom:153")
          s=s.replace("list:{padding:14,gap:14,paddingBottom:100", "list:{padding:14,gap:14,paddingBottom:148")
          s=s.replace("form:{padding:20,gap:14,paddingBottom:110", "form:{padding:20,gap:14,paddingBottom:158")
          s=s.replace("detail:{padding:20,gap:14,paddingBottom:110", "detail:{padding:20,gap:14,paddingBottom:158")
          s=s.replace("marketList:{paddingHorizontal:14,paddingBottom:110", "marketList:{paddingHorizontal:14,paddingBottom:158")
          s=s.replace("profilePage:{paddingHorizontal:16,paddingTop:6,paddingBottom:110", "profilePage:{paddingHorizontal:16,paddingTop:6,paddingBottom:158")
          p.write_text(s)
          PY
      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean
      - name: Build release APK with bundled JavaScript
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kaikki-fi-Android-Release-APK
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
