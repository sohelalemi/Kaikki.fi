name: Add forgot password

on:
  push:
    paths:
      - '.github/workflows/add-forgot-password.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch mobile login
        shell: python
        run: |
          from pathlib import Path
          p = Path('mobile/App.js')
          s = p.read_text()
          old_fn = " async function submitAuth(){if(!email||password.length<6)return Alert.alert('Tarkista tiedot','Anna sähköposti ja vähintään 6 merkin salasana.');const r=authMode==='login'?await supabase.auth.signInWithPassword({email,password}):await supabase.auth.signUp({email,password});if(r.error)Alert.alert('Virhe',r.error.message)}"
          new_fn = old_fn + "\n async function resetPassword(){if(!email.trim())return Alert.alert('Sähköposti','Kirjoita ensin sähköpostiosoitteesi.');const{error}=await supabase.auth.resetPasswordForEmail(email.trim());if(error)return Alert.alert('Virhe',error.message);Alert.alert('Tarkista sähköposti','Lähetimme salasanan palautuslinkin sähköpostiisi.')}"
          old_ui = "<Pressable style={s.primary} onPress={submitAuth}><Text style={s.primaryText}>{authMode==='login'?'Kirjaudu':'Luo tili'}</Text></Pressable><Pressable onPress={()=>setAuthMode(authMode==='login'?'signup':'login')}>"
          new_ui = "<Pressable style={s.primary} onPress={submitAuth}><Text style={s.primaryText}>{authMode==='login'?'Kirjaudu':'Luo tili'}</Text></Pressable>{authMode==='login'?<Pressable onPress={resetPassword}><Text style={s.link}>Unohditko salasanasi?</Text></Pressable>:null}<Pressable onPress={()=>setAuthMode(authMode==='login'?'signup':'login')}>"
          if old_fn not in s:
              raise SystemExit('submitAuth anchor not found')
          if old_ui not in s:
              raise SystemExit('login UI anchor not found')
          s = s.replace(old_fn, new_fn, 1).replace(old_ui, new_ui, 1)
          p.write_text(s)
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/App.js
          git diff --cached --quiet && exit 0
          git commit -m "Add forgot password to mobile login"
          git push origin main
