name: Fix mobile seller phone
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-seller-phone.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile seller phone
        shell: python
        run: |
          from pathlib import Path
          p=Path('mobile/App.js')
          s=p.read_text(encoding='utf-8')

          old="import{ActivityIndicator,Alert,FlatList,Image,Pressable,SafeAreaView,ScrollView,StyleSheet,Text,TextInput,View}from'react-native';"
          new="import{ActivityIndicator,Alert,FlatList,Image,Linking,Pressable,SafeAreaView,ScrollView,StyleSheet,Text,TextInput,View}from'react-native';"
          if old in s:
              s=s.replace(old,new,1)

          old="function extraDetailRows(item){return Object.entries(item.extra||{}).filter(([,v])=>String(v||'').trim()).map(([k,v])=>{const label=(categoryFieldConfig[item.category]||[]).find(([key])=>key===k)?.[1]||k;return <View key={k} style={s.detailRow}><Text style={s.detailLabel}>{label}</Text><Text style={s.detailValue}>{String(v)}</Text></View>})}"
          new="function extraDetailRows(item){const skip=new Set(['contact','vehicleExtra','amenities']);return Object.entries(item.extra||{}).filter(([k,v])=>!skip.has(k)&&v!==null&&v!==undefined&&String(v||'').trim()&&typeof v!=='object').map(([k,v])=>{const label=(categoryFieldConfig[item.category]||[]).find(([key])=>key===k)?.[1]||k;return <View key={k} style={s.detailRow}><Text style={s.detailLabel}>{label}</Text><Text style={s.detailValue}>{String(v)}</Text></View>})}\n function sellerPhone(item){return String(item?.extra?.contact||'').trim()}\n async function callSeller(item){const phone=sellerPhone(item);if(!phone)return Alert.alert('Puhelinnumero','Myyjä ei ole lisännyt puhelinnumeroa.');const cleaned=phone.replace(/[^0-9+]/g,'');if(!cleaned)return Alert.alert('Puhelinnumero','Puhelinnumero ei ole kelvollinen.');try{await Linking.openURL(`tel:${cleaned}`)}catch(e){Alert.alert('Puhelu','Puhelinsovellusta ei voitu avata.')}}"
          if old not in s:
              raise SystemExit('extraDetailRows anchor not found')
          s=s.replace(old,new,1)

          old="<View style={s.infoBox}><Text style={s.sectionTitle}>Myyjä</Text><Text>{selectedListing.user_id===session.user.id?'Sinun ilmoituksesi':'Kaikki.fi käyttäjä'}</Text></View>"
          new="<View style={s.infoBox}><Text style={s.sectionTitle}>Myyjä</Text><Text>{selectedListing.user_id===session.user.id?'Sinun ilmoituksesi':'Kaikki.fi käyttäjä'}</Text>{sellerPhone(selectedListing)?<Pressable onPress={()=>callSeller(selectedListing)}><Text style={s.link}>📞 {sellerPhone(selectedListing)}</Text></Pressable>:<Text style={s.meta}>Puhelinnumeroa ei ole lisätty</Text>}</View>"
          if old not in s:
              raise SystemExit('seller box anchor not found')
          s=s.replace(old,new,1)

          old="extra:listingExtra,image_urls,latitude:listingLocation.latitude,longitude:listingLocation.longitude"
          new="extra:{...listingExtra,contact:String(listingExtra.contact||profilePhone||'').trim()},image_urls,latitude:listingLocation.latitude,longitude:listingLocation.longitude"
          if old in s:
              s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "Kaikki.fi"
          git config user.email "ayatalimi3366@gmail.com"
          git add mobile/App.js
          git diff --cached --quiet && exit 0
          git commit -m "Show callable seller phone in mobile listing details"
          git push
