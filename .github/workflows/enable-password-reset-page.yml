name: Enable password reset page

on:
  push:
    paths:
      - '.github/workflows/enable-password-reset-page.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add reset password script to web page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<script src="app.js?v=20260808-4"></script>'
          insert='<script src="reset-password.js?v=20260815-1"></script>' + marker
          if 'reset-password.js' not in s:
              if marker not in s:
                  raise SystemExit('app.js marker not found')
              s=s.replace(marker, insert, 1)
              p.write_text(s)
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable password reset on web"
          git push
